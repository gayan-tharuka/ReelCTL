[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "reelctl"
version = "1.0.0"
description = "AI-Powered Media Organizer - Intelligently organize movie and TV show collections"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [
    { name = "Gayan Tharuka" },
]
keywords = ["media", "organizer", "movies", "tv-shows", "ai", "tmdb", "cli"]

dependencies = [
    "typer>=0.15.0",
    "rich>=14.0.0",
    "httpx>=0.28.0",
    "guessit>=3.8.0",
    "send2trash>=1.8.0",
    "loguru>=0.7.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "python-dotenv>=1.0.0",
    "chardet>=5.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.25.0",
    "pytest-cov>=6.0.0",
]

[project.scripts]
reelctl = "reelctl.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/reelctl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
